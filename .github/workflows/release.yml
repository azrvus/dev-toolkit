name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destination:
        description: Verify artifacts only, or rehearse on configured TestPyPI
        required: true
        default: verify
        type: choice
        options: [verify, testpypi]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require a merged commit and matching release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import os
          import runpy
          version = runpy.run_path('src/dev_toolkit/_version.py')['__version__']
          if os.environ['EVENT_NAME'] == 'release':
              assert os.environ['REF_TYPE'] == 'tag'
              assert os.environ['REF_NAME'] == f'v{version}', 'Tag/version mismatch'
          else:
              assert os.environ['REF_NAME'] == 'main', 'Dispatch from main only'
          PY
      - name: Test and build
        run: |
          python -m pip install -e . pytest ruff uv twine
          ruff check .
          pytest
          uv build
          python -m twine check --strict dist/*
          python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dev-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dev-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Rehearse with TestPyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
